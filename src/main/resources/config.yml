# Настройки NanoForge.
#
# update-checker: при старте сервера плагин (асинхронно, не блокируя сервер)
# проверяет GitHub Releases репозитория NanoDev1488/NanoForge. Если там есть
# версия новее текущей, jar автоматически скачивается в plugins/update/ -
# это штатная папка Bukkit/Spigot/Paper, и файл из неё сам подменит старый
# jar в plugins/ ПРИ СЛЕДУЮЩЕМ запуске сервера, до загрузки любых плагинов.
# Поэтому это безопасно и на Windows (где нельзя перезаписать используемый
# .jar), и на Linux - объект на диске никто не держит открытым в момент замены.
update-checker:
  # Проверять обновления автоматически при каждом старте сервера.
  enabled: true
  # Писать результат проверки в консоль (и успех, и "уже актуальная версия").
  # Если false - сообщение об уже-актуальной версии не печатается, но при
  # найденном обновлении предупреждение всё равно выводится.
  notify-console: true

