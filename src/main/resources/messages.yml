# Все сообщения плагина NanoForge (игроку/админу в чат, админу в консоль) -
# собраны здесь единым файлом, чтобы можно было поменять текст/цвета без
# пересборки плагина. Поддерживаются цветовые коды вида &a/&c/&6 (их
# транслирует ru.nanodev.nanoforge.util.Messages через
# ChatColor.translateAlternateColorCodes('&', ...)), а также плейсхолдеры
# вида {name}, которые подставляются тем же классом.
#
# ВАЖНО: это сообщения САМОГО ПЛАГИНА (его Java-код). Текст, который автор
# аддона пишет в своём addon.yml (actions message/broadcast/console,
# deny_message и т.п.), здесь НЕ хранится и не должен - это контент аддона,
# а не плагина.
#
# Правки этого файла подхватываются без перезапуска сервера командой
# /nano reload (см. ru.nanodev.nanoforge.util.Messages#reload).

# NanoCommand оформляет свои сообщения через FancyFont.stylize() (обёртка f(...) в
# самом классе) - стилизуется только "голый" текст без цветовых кодов/символов/
# плейсхолдеров переменных, а цвет (ChatColor.*), символ-декорация (★ ➤ • ✔ ✖ ⚠) и
# сами переменные (имена аддонов, пути и т.п.) остаются в Java-коде КАК БЫЛО и
# собираются вокруг строки отсюда - поэтому ниже лежит ЧИСТЫЙ текст без &-кодов,
# ровно тот же, что раньше передавался в f("...") напрямую.
