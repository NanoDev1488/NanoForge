dynamic:
  # DynamicCommand прогоняет текст через FancyFont.stylize() напрямую (как и f() в
  # NanoCommand/MenuManager) - здесь поэтому только чистый текст без §-кодов и символа ✖,
  # они остаются в Java и собираются вокруг строки отсюда, как было раньше.
  command:
    disabled: "Этот аддон сейчас выключен."
    no-permission: "У тебя нет права:"
    error: "Ошибка при выполнении команды аддона"
    error-log: "[NanoForge] Ошибка в команде аддона '{addon}' ({command}): {error}"
